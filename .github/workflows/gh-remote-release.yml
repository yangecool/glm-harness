# GH remote runtime archive release on GitHub-hosted runners.
#
# Builds the relocatable gh-remote archive from GH-005 (POSIX bootstrap,
# per-file sha256 manifest, staged closure smoke) for every supported target
# on its native host, and attaches the archives to a `gh-v*` GitHub release
# so remote hosts can download them. Main pushes retain preview artifacts;
# only `gh-v*` tags publish. Targets are POSIX-only (linux-x64, linux-arm64).
name: GH Remote · Runtime archives

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['gh-v*']

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: gh-remote-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the workspace runtime
        run: pnpm run build
      - name: Build the relocatable gh-remote archive
        run: node --import tsx/esm scripts/build-gh-remote-archive.ts --target ${{ matrix.target }}
      - name: Retain the archive and its digest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gh-remote-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            dist-exe/gh-remote/*.tar.gz
            dist-exe/gh-remote/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Attach to the gh-v* release
        if: startsWith(github.ref, 'refs/tags/gh-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist-exe/gh-remote/*.tar.gz dist-exe/gh-remote/*.sha256)
          if [ ${#files[@]} -eq 0 ]; then echo 'no archive artifacts found' >&2; exit 1; fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "GH $GITHUB_REF_NAME" \
              --notes "GLM Harness preview artifacts. Windows installers are unsigned and do not use the signed auto-update channel." \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
  release:
    if: startsWith(github.ref, 'refs/tags/gh-v')
    needs: [archive]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every target archive is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          echo "$names"
          for target in linux-x64 linux-arm64; do
            echo "$names" | grep -F "$target" >/dev/null || { echo "release is missing assets for $target" >&2; exit 1; }
          done
          count="$(echo "$names" | grep -c .)"
          echo "release $GITHUB_REF_NAME carries $count asset(s)"
          [ "$count" -ge 4 ]
